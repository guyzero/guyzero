name: GitHub-Profile-3D-Contrib

on:
  schedule: # 02:00 UTC daily, one hour after the Metrics workflow so they never race on main
    - cron: "0 2 * * *"
  workflow_dispatch:

# Least privilege: the job only needs to commit the generated SVGs back to this repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      # checkout@v2 runs on a deprecated Node runtime that GitHub is removing; v5 is current.
      - uses: actions/checkout@v5
      # Pinned to a release tag (0.6.0 -> 0.9.3 picks up upstream security fixes).
      - uses: yoshi389111/github-profile-3d-contrib@0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          # Only commit and push when something actually changed
          if git commit -m "generated"; then
            git push
          else
            echo "No changes to commit."
          fi
